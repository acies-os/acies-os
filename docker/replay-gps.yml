# GPS replay on edge. Combine with edge.yml.
# Scenarios 2 (lab) and 3 (demo).
#
# Usage:
#   SCENE=2024-03-29-ICT RUN=2 GPS_LABEL=miata \
#     docker compose -f edge.yml -f replay-gps.yml up
#
# Env vars:
#   SCENE             Scene name (required)
#   RUN               Run ID (required)
#   GPS_LABEL         Target label for GPS trace (required)
#   DATA_DIR          Host path to data directory (default: /data)
#   ACIES_NAMESPACE   Edge hostname (default: machine hostname)
#   ZENOH_CONNECT     Zenoh endpoint (default: tcp/127.0.0.1:7501)
#   ACIES_LOG         Per-logger level overrides

services:
  gps:
    image: acies-server:latest
    command: >-
      acies-gps
      --data-dir /data
      --scene ${SCENE} --run ${RUN} --label ${GPS_LABEL}
      --loop
    network_mode: host
    environment:
      - PATH=/acies-os/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - ACIES_LOG=${ACIES_LOG:-}
      - ACIES_NAMESPACE=${ACIES_NAMESPACE:-}/infra
      - ACIES_NAME=gps
      - ACIES_CONNECT=${ZENOH_CONNECT:-tcp/127.0.0.1:7501}
    volumes:
      - ${DATA_DIR:-/data}:/data:ro
      - ~/.acies:/root/.acies
    restart: unless-stopped
