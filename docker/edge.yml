# Edge infrastructure: zenohd (router) + gateway + UI.
# Used in all scenarios. GPS is optional via profiles.
#
# Profiles (mutually exclusive):
#   (none)   No GPS -- zenohd + gateway + UI only
#   replay   GPS replay from parquet (lab scenarios)
#   live     Live GPS bridge over MQTT (field scenarios)
#
# Usage:
#   ACIES_NAMESPACE=$(hostname -s) docker compose -f edge.yml [--profile replay|live] up
#
# Env vars:
#   ACIES_NAMESPACE       Hostname prefix (default: must be set; use hostname -s)
#   ACIES_CONFIG          Gateway config file inside /config (default: ict.toml)
#   ACIES_LISTEN          Gateway WebSocket address (default: ws://0.0.0.0:8765)
#   UI_PORT               UI HTTP port (default: 5173)
#   ZENOH_CONNECT         Zenoh local endpoint (default: tcp/127.0.0.1:7501)
#   ZENOH_LISTEN          Zenoh external listen for pi peers (default: tcp/0.0.0.0:7447)
#   ACIES_LOG             Per-logger level overrides
#   ACIES_GATEWAY_DEBUG   Enable debug energy subscriber in gateway (unset to disable)
#   SCENE                 Scene name for GPS replay (required with replay profile)
#   RUN                   Run ID for GPS replay (required with replay profile)
#   GPS_LABEL             Target label for GPS trace (required with replay profile)
#   DATA_DIR              Host path to data directory (default: /data)
#   MQTT_BROKER           MQTT broker hostname or IP (required with live profile)
#   MQTT_PORT             MQTT broker port (default: 1883)
#   MQTT_TOPIC            MQTT topic pattern (default: /+/gps)

services:
  zenohd:
    image: acies-server:latest
    command: >-
      zenohd
      --listen ${ZENOH_LISTEN:-tcp/0.0.0.0:7447}
      --listen ${ZENOH_CONNECT:-tcp/127.0.0.1:7501}
    network_mode: host
    volumes:
      - ~/.acies:/root/.acies
    restart: unless-stopped

  gateway:
    image: acies-server:latest
    command: acies-gateway --config /config/${ACIES_CONFIG:-ict.toml}
    network_mode: host
    environment:
      - PATH=/acies-os/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - ACIES_LOG=${ACIES_LOG:-}
      - ACIES_NAMESPACE=${ACIES_NAMESPACE:-}/infra
      - ACIES_NAME=gateway
      - ACIES_CONNECT=${ZENOH_CONNECT:-tcp/127.0.0.1:7501}
      - ACIES_LISTEN=${ACIES_LISTEN:-ws://0.0.0.0:8765}
      - ACIES_GATEWAY_DEBUG=${ACIES_GATEWAY_DEBUG:-}
    volumes:
      - ~/.acies:/root/.acies
      - ../packages/controllers/data:/config:ro
    restart: unless-stopped

  ui:
    image: acies-ui:latest
    command: python -m http.server ${UI_PORT:-5173} -d /ui/static
    network_mode: host
    environment:
      - VITE_WS_URL=${ACIES_LISTEN:-ws://0.0.0.0:8765}/ws
    restart: unless-stopped

  gps:
    image: acies-server:latest
    profiles: [replay]
    command: >-
      acies-gps
      --data-dir /data
      --scene ${SCENE:-} --run ${RUN:-} --label ${GPS_LABEL:-}
      --loop
    network_mode: host
    environment:
      - PATH=/acies-os/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - ACIES_LOG=${ACIES_LOG:-}
      - ACIES_NAMESPACE=${ACIES_NAMESPACE:-}/infra
      - ACIES_NAME=gps
      - ACIES_CONNECT=${ZENOH_CONNECT:-tcp/127.0.0.1:7501}
    volumes:
      - ${DATA_DIR:-/data}:/data:ro
      - ~/.acies:/root/.acies
    restart: unless-stopped

  mqtt-gps:
    image: acies-server:latest
    profiles: [live]
    command: >-
      acies-mqtt
      --broker ${MQTT_BROKER}
      --port ${MQTT_PORT:-1883}
      --mqtt-topic ${MQTT_TOPIC:-/+/gps}
    network_mode: host
    environment:
      - PATH=/acies-os/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - ACIES_LOG=${ACIES_LOG:-}
      - ACIES_NAMESPACE=${ACIES_NAMESPACE:-}/infra
      - ACIES_NAME=mqtt-gps
      - ACIES_CONNECT=${ZENOH_CONNECT:-tcp/127.0.0.1:7501}
    volumes:
      - ~/.acies:/root/.acies
    restart: unless-stopped
