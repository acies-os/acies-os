services:
  zenohd:
    image: acies-server:latest
    command: zenohd --listen tcp/0.0.0.0:7447 --listen ${ZENOH_CONNECT:-tcp/127.0.0.1:7501}
    network_mode: host
    volumes:
      - ~/.acies:/root/.acies
    restart: unless-stopped

  acies-gateway:
    image: acies-server:latest
    command: acies-gateway
    network_mode: host
    environment:
      - PATH=/acies-os/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - ACIES_LOG=${ACIES_LOG:-}
      - ACIES_HOST=${ACIES_HOST:-}
      - ACIES_NAME=gateway
      - ACIES_CONNECT=${ZENOH_CONNECT:-tcp/127.0.0.1:7501}
    volumes:
      - ~/.acies:/root/.acies
    restart: unless-stopped
