services:
  zenohd:
    image: acies-server:latest
    command: zenohd --listen tcp/0.0.0.0:7447 --listen ${ZENOH_CONNECT:-tcp/127.0.0.1:7501}
    network_mode: host
    volumes:
      - ~/.acies:/root/.acies
    restart: unless-stopped

  acies-gateway:
    image: acies-server:latest
    command: acies-gateway --config /config/ict.toml
    network_mode: host
    environment:
      - PATH=/acies-os/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - ACIES_LOG=${ACIES_LOG:-}
      - ACIES_NAMESPACE=${ACIES_NAMESPACE:-}/infra
      - ACIES_NAME=gateway
      - ACIES_CONNECT=${ZENOH_CONNECT:-tcp/127.0.0.1:7501}
      - ACIES_LISTEN=${ACIES_LISTEN:-ws://0.0.0.0:8765}
    volumes:
      - ~/.acies:/root/.acies
      - ../../packages/controllers/data:/config:ro
    restart: unless-stopped
