# Replay sensor data (mic + geo) on 8 nodes.
#
# Required:
#   SCENE=2024-03-29-ICT RUN=2 docker compose up
#
# Override node names (e.g. for GCQ mapping):
#   SCENE=2024-08-06-GQ RUN=29 \
#     NODE_RS1=gq-1 NODE_RS3=gq-2 NODE_RS8=gq-3 NODE_RS10=gq-4 \
#     docker compose up
#
# Optional env vars:
#   DATA_DIR        Host path to data directory (default: /data)
#   ZENOH_CONNECT   Zenoh endpoint (default: tcp/127.0.0.1:7501)
#   ACIES_LOG       Per-logger level overrides (e.g. acies.corev2=DEBUG)

x-env: &env
  PATH: /acies-os/.venv/bin:/usr/local/bin:/usr/bin:/bin
  ACIES_LOG: ${ACIES_LOG:-}
  ACIES_CONNECT: ${ZENOH_CONNECT:-tcp/127.0.0.1:7501}

x-replay: &replay
  image: acies-server:latest
  network_mode: host
  volumes:
    - ${DATA_DIR:-/data}:/data:ro
    - ~/.acies:/root/.acies
  restart: unless-stopped

services:
  # --- rs1 ---
  rs1-geo:
    <<: *replay
    command: acies-replay --data-dir /data --scene ${SCENE} --node ${NODE_RS1:-rs1} --run ${RUN} --modality geo
    environment: { <<: *env, ACIES_NAMESPACE: rs1, ACIES_NAME: geo }

  rs1-mic:
    <<: *replay
    command: acies-replay --data-dir /data --scene ${SCENE} --node ${NODE_RS1:-rs1} --run ${RUN} --modality mic
    environment: { <<: *env, ACIES_NAMESPACE: rs1, ACIES_NAME: mic }

  # --- rs2 ---
  rs2-geo:
    <<: *replay
    command: acies-replay --data-dir /data --scene ${SCENE} --node ${NODE_RS2:-rs2} --run ${RUN} --modality geo
