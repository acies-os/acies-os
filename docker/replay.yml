# Replay sensor data (mic + geo) on selected nodes, all on edge.
# Scenario 2 (lab development). Combine with edge.yml.
#
# Usage:
#
# Select nodes with --profile:
#   SCENE=2024-03-29-ICT RUN=2 \
#     docker compose -f edge.yml -f replay.yml --profile rs1 --profile rs3 up
#
# All nodes:
#   SCENE=2024-03-29-ICT RUN=2 \
#     docker compose -f edge.yml -f replay.yml --profile all up
#
# Each node also runs a drone audio replay (8 kHz upsampled to 16 kHz, <ns>/drone_mic) that starts
# deactivated; set its `deactivated` key to false to begin playback.
#
# Override replay node names (e.g. for GCQ mapping):
#   SCENE=2024-08-06-GQ RUN=29 NODE_RS1=gq-1 NODE_RS3=gq-2 \
#     docker compose -f edge.yml -f replay.yml --profile rs1 --profile rs3 up
#
# Env vars:
#   SCENE             Scene name (required)
#   RUN               Run ID (required)
#   NODE_RS*          Override replay node name per host
#   DRONE_SCENE       Drone audio scene (default: audrok)
#   DRONE_RUN         Drone audio run ID (default: 1)
#   DRONE_NODE_RS*    Drone audio node name in filename per host (default: rs1)
#   DATA_DIR          Host path to data directory (default: /data)
#   ZENOH_CONNECT     Zenoh endpoint (default: tcp/127.0.0.1:7501)
#   ACIES_LOG         Per-logger level overrides

x-env: &env
  PATH: /acies-os/.venv/bin:/usr/local/bin:/usr/bin:/bin
  ACIES_LOG: ${ACIES_LOG:-}
  ACIES_CONNECT: ${ZENOH_CONNECT:-tcp/127.0.0.1:7501}

x-replay: &replay
  image: acies-server:latest
  network_mode: host
  volumes:
    - ${DATA_DIR:-/data}:/data:ro
    - ~/.acies:/root/.acies
  restart: unless-stopped

services:
  # --- rs1 ---
  rs1-geo:
    <<: *replay
    profiles: [rs1, all]
    command: acies-replay --data-dir /data --scene ${SCENE} --node ${NODE_RS1:-rs1} --run ${RUN} --modality geo
    environment: { <<: *env, ACIES_NAMESPACE: rs1, ACIES_NAME: geo }

  rs1-mic:
    <<: *replay
    profiles: [rs1, all]
    command: acies-replay --data-dir /data --scene ${SCENE} --node ${NODE_RS1:-rs1} --run ${RUN} --modality mic
    environment: { <<: *env, ACIES_NAMESPACE: rs1, ACIES_NAME: mic }

  rs1-drone-mic:
    <<: *replay
    profiles: [rs1, all]
    command: acies-replay --data-dir /data --scene ${DRONE_SCENE:-audrok} --node ${DRONE_NODE_RS1:-rs1} --run ${DRONE_RUN:-1} --modality drone_mic --deactivated
    environment: { <<: *env, ACIES_NAMESPACE: rs1, ACIES_NAME: drone_mic }

  # --- rs2 ---
  rs2-geo:
    <<: *replay
    profiles: [rs2, all]
