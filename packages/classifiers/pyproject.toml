[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "acies-classifiers"
version = "0.3.0"
description = "Acies classifilers built with state-of-the-art models."
authors = [
  { name = "Jinyang Li", email = "jinyang7@illinois.edu" },
  { name = "Shangchen Wu", email = "sw57@illinois.edu" },
  { name = "Yizhuo Chen", email = "yizhuoc@illinois.edu" },
  { name = "Tianshi Wang", email = "tianshi34@illinois.edu" },
  { name = "Tommy Kimura", email = "tkimura4@illinois.edu" },
  { name = "Denizhan Kara", email = "kara4@illinois.edu" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "acies-buffers",
  "acies-core",
  # "deepsense-augmented @ git+ssh://github.com/acies-os/deepsense-augmented.git",
  "foundation-sense @ git+ssh://github.com/acies-os/FoundationSense.git",
  "numpy>=1.24.4,<2",
]
# scripts.acies-ds = "acies.classifier.ds:main"
# scripts.acies-noise-detector = "acies.classifier.noise_detector:main"
scripts.acies-vfm = "acies.classifiers.vibrofm:main"

[dependency-groups]
docs = [
  "livereload>=2.7.1",
  "pydata-sphinx-theme>=0.16.1",
  "sphinx>=8.1.3",
  "sphinx-autodoc-typehints>=3.0.1",
  "sphinx-copybutton>=0.5.2",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/acies" ]
metadata.allow-direct-references = true

[tool.uv]
sources.acies-buffers = { workspace = true }
sources.acies-core = { workspace = true }
