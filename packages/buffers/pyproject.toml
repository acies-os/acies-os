[project]
name = "acies-buffers"
version = "0.1.1"
description = "Buffer utilities for Acies"
authors = [
    { name = "Jinyang Li", email = "jinyang7@illinois.edu" },
    { name = "Tommy Kimura", email = "tkimura4@illinois.edu" },
]
dependencies = []
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/acies"]

[tool.ruff]
line-length = 120
lint.extend-select = ['Q', 'RUF100', 'C90', 'I']
lint.unfixable = ['F401']
lint.flake8-quotes = { inline-quotes = 'single', multiline-quotes = 'double' }
lint.mccabe = { max-complexity = 13 }
format = { quote-style = 'single' }
