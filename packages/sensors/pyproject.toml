[project]
name = "acies-sensors"
version = "0.1.0"
description = "Sensor services for AciesOS (microphone, geophone)."
requires-python = ">=3.10"
dependencies = [
    "acies-core",
    "numpy>=1.24",
    "rawshake",
    "sounddevice>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/acies"]

[project.scripts]
acies-geo = "acies.sensors.geo:main"
acies-mic = "acies.sensors.mic:main"

[tool.uv.sources]
acies-core = { workspace = true }
rawshake = { git = "https://github.com/jinyangustc/rawshake.git" }
