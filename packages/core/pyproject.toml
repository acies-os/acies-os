[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "acies-core"
version = "0.4.0"
description = "Core library for the Acies project"
authors = [ { name = "Jinyang Li", email = "jinyang7@illinois.edu" } ]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click>=8.3.1",
  "eclipse-zenoh>=1.8,<2",
  "msgspec>=0.20",
]
scripts.acies-echo = "acies.core.echo:main"
scripts.ash = "acies.core.shell:main"

[dependency-groups]
dev = [
  "pydata-sphinx-theme>=0.16.1",
  "sphinx>=8.1.3",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-autodoc-typehints>=3.0.1",
  "sphinx-copybutton>=0.5.2",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/acies" ]
metadata.allow-direct-references = true

[tool.ruff]
line-length = 120
format = { quote-style = "single" }
lint.extend-select = [ "C90", "I", "Q", "RUF100" ]
lint.flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
lint.mccabe = { max-complexity = 13 }

[tool.pytest]
ini_options.markers = [
  "zenoh: tests that require zenoh peer-to-peer networking (no daemon needed)",
]
