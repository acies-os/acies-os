[project]
name = "acies-core"
version = "0.4.0"
description = "Core library for the Acies project"
requires-python = ">=3.10"
authors = [{ name = "Jinyang Li", email = "jinyang7@illinois.edu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/acies"]

dependencies = [
    "pip>=24.0",
    "eclipse-zenoh==0.11.0",
    "ipython>=8.25.0",
    "psutil>=5.9.8",
    "click>=8.1.7",
]

[project.scripts]
acies-echo = "acies.core.echo:main"
ash = "acies.core.shell:main"

[tool.ruff]
line-length = 120
lint.extend-select = ['Q', 'RUF100', 'C90', 'I']
lint.flake8-quotes = { inline-quotes = 'single', multiline-quotes = 'double' }
lint.mccabe = { max-complexity = 13 }
format = { quote-style = 'single' }

[dependency-groups]
dev = [
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-copybutton>=0.5.2",
]
