[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "acies-controllers"
version = "0.2.0"
description = "Acies Control Plane"
authors = [ { name = "Jinyang Li", email = "jinyang7@illinois.edu" } ]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "acies-buffers",
  "acies-core",
  "paho-mqtt>=2.1",
  "tomli>=2.4",
]
# scripts.acies-controller = "acies.controller.base:main"
# scripts.acies-twinctl = "acies.twin.twinctl:main"
scripts.acies-gateway = "acies.gateway.gateway:main"
scripts.acies-mqtt = "acies.gateway.mqtt:main"
scripts.acies-tracker = "acies.controller.tracker:main"

[tool.hatch]
build.targets.wheel.packages = [ "src/acies" ]
metadata.allow-direct-references = true

[tool.uv]
sources.acies-buffers = { workspace = true }
sources.acies-core = { workspace = true }
