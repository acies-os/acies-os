# map selected map and target to the corresponding runID path
[routes]
wagoneer = "2026-04-14-West-Point/run6"
kona = "2026-04-14-West-Point/run0"

[models.vfm]
labels = ["wagoneer", "kona"]

[models.vfm.weight]
both = "/model/Parkland_TransformerV4_vehicle_classification_finetune_wp2026_1.0_multiclass_distance-100_latest.pt"
seismic = "/model/Parkland_TransformerV4_vehicle_classification_finetune_wp2026_1.0_seismic_multiclass_best.pt"
audio = "/model/Parkland_TransformerV4_vehicle_classification_finetune_wp2026_1.0_audio_multiclass_best.pt"


# Confidence threshold to filter multi-label output
[confidence_threshold.vfm]
wagoneer = 0.60
kona = 0.65
miata = 1.1
cx30 = 1.1
gle350 = 1.1
mustang = 1.1

[ensemble]
# ensemble temporal window size in seconds
win = 30

# minimum number of predictions required to calculate the ensemble result
size = 3

# Confidence threshold to filter ensemble output
# meaning: number of detection in win
[ensemble_confidence_threshold]
suv = 4
sedan = 4

