# Confidence threshold to filter multi-label output
[confidence_threshold]
miata = 1.1
cx30 = 0.75
gle350 = 0.65
mustang = 1.1

polaris = 0.95
warthog = 0.95
truck = 0.80
husky = 0.95

[ensemble]
# ensemble temporal window size in seconds
win = 30

# minimum number of predictions required to calculate the ensemble result
size = 3

# Confidence threshold to filter ensemble output
# meaning: number of detection in win
[ensemble_confidence_threshold]
miata = 4
cx30 = 4
gle350 = 4
mustang = 4
polaris = 4
warthog = 4
truck = 4
husky = 4

[noise_thresh]
rs1 = { geo = 100000, mic = 3500 }
rs2 = { geo = 100000, mic = 3500 }
rs3 = { geo = 100000, mic = 3500 }
rs5 = { geo = 100000, mic = 3500 }
rs6 = { geo = 100000, mic = 3500 }
rs7 = { geo = 100000, mic = 3500 }
rs8 = { geo = 100000, mic = 3500 }
rs10 = { geo = 100000, mic = 3500 }

[service_types]
geo = "(?:.*[^_]+|^)(geo).*"
mic = "(?:.*[^_]+|^)(mic).*"
infer = ".*((?:vfm|mae|ds)(?:_geo|_mic)*).*"

[dependencies]
vfm = ['geo', 'mic']
vfm_mic = ["mic"]
vfm_geo = ["geo"]


