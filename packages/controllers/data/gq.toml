# Node locations
[gps]
# node_name = [latitude, longitude]
gq-1 = [39.350809, -76.344938]
gq-2 = [39.350933, -76.344952]
gq-3 = [39.351015, -76.344871]
gq-4 = [39.351153, -76.344783]

[routes]
warthog = "2024-08-06-GQ/run2"
polaris = "2024-08-06-GQ/run29"
polaris_warthog = "2024-08-06-GQ/run57"

# map gq-X to rsY for GCQ
[map_node_mapping]
gq-1 = "rs1"
gq-2 = "rs3"
gq-3 = "rs8"
gq-4 = "rs10"

[models.vfm]
labels = ["polaris", "warthog", "truck", "husky"]

[models.vfm.weight]
both = "/model/Parkland_TransformerV4_vehicle_classification_finetune_gcq_1.0_multiclass_best.pt"
seismic = "/model/Parkland_TransformerV4_vehicle_classification_finetune_gcq_1.0_seismic_multiclass_best.pt"
audio = "/model/Parkland_TransformerV4_vehicle_classification_finetune_gcq_1.0_audio_multiclass_best.pt"

# Confidence threshold to filter multi-label output
[confidence_threshold]

[confidence_threshold.vfm]
miata = 1.1
cx30 = 0.75
gle350 = 0.65
mustang = 1.1
polaris = 0.95
warthog = 0.95
truck = 0.80
husky = 0.95

[confidence_threshold.vfm_mic]
miata = 1.1
cx30 = 0.75
gle350 = 0.65
mustang = 1.1
polaris = 0.95
warthog = 0.95
truck = 0.80
husky = 0.95

[confidence_threshold.vfm_geo]
miata = 1.1
cx30 = 0.75
gle350 = 0.65
mustang = 1.1
polaris = 0.95
warthog = 0.95
truck = 0.80
husky = 0.95

[confidence_threshold.mae]
miata = 1.1
cx30 = 0.75
gle350 = 0.65
mustang = 1.1
polaris = 0.95
warthog = 0.95
truck = 0.80
husky = 0.95

[confidence_threshold.mae_mic]
miata = 1.1
cx30 = 0.75
gle350 = 0.65
mustang = 1.1
polaris = 0.95
warthog = 0.95
truck = 0.80
husky = 0.95

[confidence_threshold.mae_geo]
miata = 1.1
cx30 = 0.75
gle350 = 0.65
mustang = 1.1
polaris = 0.95
warthog = 0.95
truck = 0.80
husky = 0.95

[ensemble]
# ensemble temporal window size in seconds
win = 30

# minimum number of predictions required to calculate the ensemble result
size = 1

# Confidence threshold to filter ensemble output
# meaning: number of detection in win
[ensemble_confidence_threshold]
miata = 4
cx30 = 4
gle350 = 4
mustang = 4
polaris = 4
warthog = 4
truck = 4
husky = 4

[noise_thresh]
dvpg-gq-1-shake = { mic = 100000, geo = 3500 }
dvpg-gq-2-shake = { mic = 100000, geo = 3500 }
dvpg-gq-3-shake = { mic = 100000, geo = 3500 }
dvpg-gq-4-shake = { mic = 100000, geo = 3500 }

[service_types]
geo = "(?:.*[^_]+|^)(geo).*"
mic = "(?:.*[^_]+|^)(mic).*"
infer = ".*((?:vfm|mae|ds)(?:_geo|_mic)*).*"

[dependencies]
vfm = ['geo', 'mic']
vfm_mic = ["mic"]
vfm_geo = ["geo"]
mae = ['geo', 'mic']
mae_mic = ["mic"]
mae_geo = ["geo"]


