[project]
name = "acies-controller"
version = "0.2.0"
description = "Acies Control Plane"
authors = [{ name = "Jinyang Li", email = "jinyang7@illinois.edu" }]
dependencies = [
    "click>=8.1.7",
    "torch>=2.3.0",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "acies-core",
    "acies-buffers",
    "ipdb>=0.13.13",
    "tomli>=2.0.1",
    "websockets>=12.0",
]
readme = "README.md"
requires-python = ">= 3.10"

[tool.uv.sources]
acies-core = { workspace = true }
acies-buffers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/acies"]

[project.scripts]
acies-controller = "acies.controller.base:main"
acies-twinctl = "acies.twin.twinctl:main"

[tool.ruff]
line-length = 120
lint.extend-select = ['Q', 'RUF100', 'C90', 'I']
lint.unfixable = ['F401']
lint.flake8-quotes = { inline-quotes = 'single', multiline-quotes = 'double' }
lint.mccabe = { max-complexity = 13 }
format = { quote-style = 'single' }
